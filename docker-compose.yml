version: '3.8'

services:
  streamlit_app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: brain_tumor_streamlit
    ports:
      - \"8501:8501\"
    volumes:
      - ./app:/app/app
      - ./weights:/app/weights
    environment:
      - CUDA_VISIBLE_DEVICES=-1 # Use CPU for inference by default
